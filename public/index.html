<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최부장 내 자료실 (Secret Vault Beta)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }
        h1 { font-size: 1.75rem; color: var(--accent); margin: 0 0 0.5rem 0; }
        p.subtitle { color: var(--text-sub); margin: 0; font-size: 0.95rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.25rem;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        .card h3 {
            margin: 0 0 0.75rem 0;
            font-size: 1.1rem;
            color: var(--accent);
        }
        .card p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e2e8f0;
        }
        .loading, .error {
            text-align: center;
            padding: 3rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔒 최부장 내 자료실 (Secret Vault Beta)</h1>
            <p class="subtitle">Stage 2: Serverless API & Supabase DB 연동 상태</p>
        </header>

        <main id="notes-container">
            <div class="loading">서버 API에서 보안 자료를 로딩 중입니다...</div>
        </main>
    </div>

    <script>
        async function fetchNotes() {
            const container = document.getElementById('notes-container');
            try {
                // Fetch notes from Vercel Serverless API endpoint
                const res = await fetch('/api/notes');
                if (!res.ok) throw new Error('API 호출 실패');
                
                const notes = await res.json();
                
                if (!notes || notes.length === 0) {
                    container.innerHTML = '<div class="loading">등록된 메모가 없습니다.</div>';
                    return;
                }

                container.innerHTML = `<div class="grid">${
                    notes.map(note => `
                        <div class="card">
                            <h3>${escapeHtml(note.title)}</h3>
                            <p>${escapeHtml(note.content)}</p>
                        </div>
                    `).join('')
                }</div>`;
            } catch (err) {
                container.innerHTML = `<div class="error">메모를 불러올 수 없습니다. API 연동 또는 환경변수를 확인해 주세요.</div>`;
            }
        }

        function escapeHtml(text) {
            return text
                ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;")
                : '';
        }

        document.addEventListener('DOMContentLoaded', fetchNotes);
    </script>
</body>
</html>
