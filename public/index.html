<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 24px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth form { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; color: #bfd0e5; }
    input, button { box-sizing: border-box; width: 100%; padding: 11px 12px; border-radius: 8px; font: inherit; }
    input { border: 1px solid #71849a; background: #101a28; color: #ecf4ff; }
    button { border: 0; background: #8ad8df; color: #101a28; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    textarea { box-sizing: border-box; width: 100%; min-height: 130px; padding: 11px 12px; border: 1px solid #71849a; border-radius: 8px; background: #101a28; color: #ecf4ff; font: inherit; }
    .note-actions { display: flex; gap: 8px; margin-top: 12px; }
    .note-actions button, #cancel-edit { width: auto; }
    #auth-status, #auth-error { min-height: 1.5em; margin: 10px 0 0; font-size: 15px; }
    #auth-error { color: #ffb7c3; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 1단계 피해 확인</div>
    <h1>점령된 자료실</h1>
    <p>지금은 보호 장치가 없는 상태입니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <section class="auth" aria-labelledby="auth-heading">
      <h2 id="auth-heading">자료실 로그인</h2>
      <form id="login-form">
        <label>이메일 <input id="email" name="email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <p id="auth-status" aria-live="polite">로그아웃 상태입니다.</p>
      <p id="auth-error" role="alert" hidden></p>
      <button id="logout-button" type="button" hidden>로그아웃</button>
    </section>
    <form id="note-form" class="auth" hidden>
      <h2 id="note-form-heading">가상 메모 추가</h2>
      <input id="note-id" type="hidden">
      <label>제목 <input id="note-title" name="title" required maxlength="200"></label>
      <label>본문 <textarea id="note-body" name="body" required></textarea></label>
      <button id="note-save" type="submit">메모 추가</button>
      <button id="cancel-edit" type="button" hidden>수정 취소</button>
      <p id="note-error" role="alert" hidden></p>
    </form>
    <ul id="notes" aria-live="polite"><li>로그인 후 자료를 불러옵니다.</li></ul>
  </main>
  <script type="module">
    const loginForm = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const authStatus = document.querySelector('#auth-status');
    const authError = document.querySelector('#auth-error');
    const noteForm = document.querySelector('#note-form');
    const noteId = document.querySelector('#note-id');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteSave = document.querySelector('#note-save');
    const noteError = document.querySelector('#note-error');
    const noteFormHeading = document.querySelector('#note-form-heading');
    const cancelEdit = document.querySelector('#cancel-edit');
    let activeSession = null;
    let notesLoadVersion = 0;
    const SESSION_STORAGE_KEY = 'byte-back-session';

    function showAuthError(message) {
      authError.textContent = message;
      authError.hidden = false;
    }

    const list = document.querySelector('#notes');

    async function authRequest(payload) {
      const response = await fetch('/api/auth', {
        method: 'POST',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result?.error || '인증 요청을 처리하지 못했습니다.');
      return result;
    }

    function setSession(session) {
      activeSession = session;
      if (session?.access_token && session?.refresh_token) {
        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session));
      } else {
        localStorage.removeItem(SESSION_STORAGE_KEY);
      }
      const signedIn = Boolean(session?.access_token);
      authStatus.textContent = signedIn
        ? `로그인됨: ${session.user?.email ?? '계정'}`
        : '로그아웃 상태입니다.';
      loginForm.hidden = signedIn;
      logoutButton.hidden = !signedIn;
      noteForm.hidden = !signedIn;
      authError.hidden = true;
      authError.textContent = '';
      void loadNotes(session);
    }

    async function restoreSession() {
      let saved;
      try { saved = JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || 'null'); }
      catch { saved = null; }
      if (!saved?.refresh_token) return setSession(null);
      try { setSession(await authRequest({ action: 'refresh', refresh_token: saved.refresh_token })); }
      catch { setSession(null); }
    }

    function showNoteError(message) {
      noteError.textContent = message;
      noteError.hidden = false;
    }

    function resetNoteForm() {
      noteForm.reset();
      noteId.value = '';
      noteFormHeading.textContent = '가상 메모 추가';
      noteSave.textContent = '메모 추가';
      cancelEdit.hidden = true;
      noteError.hidden = true;
      noteError.textContent = '';
    }

    async function notesRequest(path, options = {}) {
      if (!activeSession?.access_token) throw new Error('로그인이 필요합니다.');
      const response = await fetch(path, {
        ...options,
        cache: 'no-store',
        headers: {
          Authorization: `Bearer ${activeSession.access_token}`,
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
          ...(options.headers ?? {}),
        },
      });
      const result = response.status === 204 ? null : await response.json();
      if (!response.ok) throw new Error(result?.error || '요청을 처리할 수 없습니다.');
      return result;
    }

    function renderNotes(notes) {
      list.replaceChildren(...notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');
        const actions = document.createElement('div');
        const edit = document.createElement('button');
        const remove = document.createElement('button');
        title.textContent = note.title;
        content.textContent = note.body;
        actions.className = 'note-actions';
        edit.type = 'button';
        edit.textContent = '수정';
        edit.dataset.action = 'edit';
        edit.dataset.id = note.id;
        remove.type = 'button';
        remove.textContent = '삭제';
        remove.dataset.action = 'delete';
        remove.dataset.id = note.id;
        actions.append(edit, remove);
        item.append(title, content, actions);
        return item;
      }));
      if (!notes.length) {
        const empty = document.createElement('li');
        empty.textContent = '아직 추가한 메모가 없습니다.';
        list.append(empty);
      }
    }

    async function loadNotes(session) {
      const version = ++notesLoadVersion;
      activeSession = session;
      noteForm.hidden = !session?.access_token;
      if (!session?.access_token) {
        list.replaceChildren();
        const item = document.createElement('li');
        item.textContent = '로그인하면 가상 자료를 볼 수 있습니다.';
        list.append(item);
        return;
      }
      list.replaceChildren();
      const loading = document.createElement('li');
      loading.textContent = '가상 자료를 불러오는 중입니다.';
      list.append(loading);
      try {
        const result = await notesRequest('/api/notes');
        if (version !== notesLoadVersion || session?.access_token !== activeSession?.access_token) return;
        if (!Array.isArray(result)) throw new Error('자료 형식이 맞지 않습니다.');
        renderNotes(result);
      } catch (error) {
        if (version !== notesLoadVersion) return;
        const item = document.createElement('li');
        item.textContent = error.message;
        list.replaceChildren(item);
      }
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      authError.hidden = true;
      loginButton.disabled = true;
      const form = new FormData(loginForm);
      try {
        setSession(await authRequest({
          action: 'login', email: form.get('email'), password: form.get('password')
        }));
        loginForm.reset();
      } catch (error) {
        showAuthError(`로그인 실패: ${error.message}`);
      } finally {
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener('click', () => setSession(null));

    noteForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      noteError.hidden = true;
      noteSave.disabled = true;
      const id = noteId.value;
      const payload = { title: noteTitle.value, body: noteBody.value };
      try {
        if (id) {
          await notesRequest(`/api/notes/${encodeURIComponent(id)}`, {
            method: 'PUT', body: JSON.stringify(payload)
          });
        } else {
          await notesRequest('/api/notes', { method: 'POST', body: JSON.stringify(payload) });
        }
        resetNoteForm();
        await loadNotes(activeSession);
      } catch (error) {
        showNoteError(error.message);
      } finally {
        noteSave.disabled = false;
      }
    });

    cancelEdit.addEventListener('click', resetNoteForm);

    list.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const { action, id } = button.dataset;
      button.disabled = true;
      try {
        if (action === 'edit') {
          const note = await notesRequest(`/api/notes/${encodeURIComponent(id)}`);
          noteId.value = note.id;
          noteTitle.value = note.title;
          noteBody.value = note.body;
          noteFormHeading.textContent = '가상 메모 수정';
          noteSave.textContent = '수정 저장';
          cancelEdit.hidden = false;
          noteError.hidden = true;
          noteForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
          noteTitle.focus();
        } else if (action === 'delete') {
          await notesRequest(`/api/notes/${encodeURIComponent(id)}`, { method: 'DELETE' });
          await loadNotes(activeSession);
          if (noteId.value === id) resetNoteForm();
        }
      } catch (error) {
        showNoteError(error.message);
      } finally {
        button.disabled = false;
      }
    });

    void restoreSession();
  </script>
</body>
</html>
